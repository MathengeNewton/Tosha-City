# ToshaCity Staging - Backend + Frontend
# toshacity-services.mangoseasonlabs.co.ke (API)
# toshacity-dashboard.mangoseasonlabs.co.ke (Dashboard)
# Place in /etc/nginx/sites-available/ and symlink to sites-enabled.
# Run: sudo certbot --nginx -d toshacity-services.mangoseasonlabs.co.ke -d toshacity-dashboard.mangoseasonlabs.co.ke

upstream toshacity_backend {
    server 127.0.0.1:4515;
    keepalive 32;
}

upstream toshacity_frontend {
    server 127.0.0.1:3015;
    keepalive 32;
}

# Backend API
server {
    listen 80;
    listen [::]:80;
    server_name toshacity-services.mangoseasonlabs.co.ke;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    client_max_body_size 20M;

    location / {
        proxy_pass http://toshacity_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# Frontend Dashboard
server {
    listen 80;
    listen [::]:80;
    server_name toshacity-dashboard.mangoseasonlabs.co.ke;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location / {
        proxy_pass http://toshacity_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
