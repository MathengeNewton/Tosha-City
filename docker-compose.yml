# LOCAL DEVELOPMENT CONFIGURATION
# This file is for local development only.
# For production deployment, use docker-compose.prod.yml
# To enforce memory limits when not using Swarm: docker compose --compatibility up

# Project name (overrides folder name e.g. toshaCity → avoids *toshacity* image/network prefixes)
name: laketown

services:
  # 1. The Database
  db:
    container_name: laketown-db
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: ${DATABASE_USER:-laketown}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-laketown_pass}
      POSTGRES_DB: ${DATABASE_NAME:-laketown_butchery}
    volumes:
      - db_data:/var/lib/postgresql/data
    # Host port defaults to 5434 so this stack does not fight system Postgres or other stacks on 5432.
    # From the host: psql -h 127.0.0.1 -p ${DATABASE_HOST_PORT:-5434} …  (inside Docker, backend still uses db:5432)
    ports:
      - "${DATABASE_HOST_PORT:-5434}:5432"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-laketown} -d ${DATABASE_NAME:-laketown_butchery}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: laketown-backend:latest
    build: ./backend
    container_name: laketown-backend
    deploy:
      resources:
        limits: { memory: 1G }
    depends_on:
      db:
        condition: service_healthy
    restart: always
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: ${DATABASE_USER:-laketown}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-laketown_pass}
      DATABASE_NAME: ${DATABASE_NAME:-laketown_butchery}
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-production}
      # Demo data only. Set SEED_DEMO_DAY=true in a throwaway local .env to insert a pork demo day
      # (products, opening stock, production) on backend startup. Never enable on the shop server.
      SEED_DEMO_DAY: ${SEED_DEMO_DAY:-false}
      JWT_SECRET: ${JWT_SECRET:-default_secret_key_change_in_production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      # CORS: must match the URL users use to open the dashboard (include port if not 80/443)
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:${FRONTEND_HOST_PORT:-3015}}
      # Extra exact origins, comma-separated. Example: http://192.168.100.119:3015
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      # Allow browsers on the private LAN (10.x, 172.16–31.x, 192.168.x) to call the API.
      CORS_ALLOW_LAN: ${CORS_ALLOW_LAN:-true}
    ports:
      - "${BACKEND_HOST_PORT:-4515}:3000"
    command: npm run start:prod
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: laketown-frontend:latest
    build:
      context: ./frontend
      args:
        # If you change BACKEND_HOST_PORT, set NEXT_PUBLIC_API_URL to match (or rebuild after updating .env)
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:${BACKEND_HOST_PORT:-4515}/api}
    deploy:
      resources:
        limits: { memory: 1G }
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:${BACKEND_HOST_PORT:-4515}/api}
    container_name: laketown-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_HOST_PORT:-3015}:3000"
    networks:
      - app-network
    depends_on:
      - backend


volumes:
  db_data: {}

networks:
  app-network:
    driver: bridge

