name: laketown

services:
  # 1. The Database
  db:
    container_name: laketown-db
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: ${DATABASE_USER:-laketown}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME:-laketown_butchery}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-laketown} -d ${DATABASE_NAME:-laketown_butchery}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: laketown-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: laketown-backend
    depends_on:
      db:
        condition: service_healthy
    restart: always
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: ${DATABASE_USER:-laketown}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_NAME: ${DATABASE_NAME:-laketown_butchery}
      PORT: 3000
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      FRONTEND_URL: ${FRONTEND_URL:-https://admin.laketown.co.ke}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      # Shop tills open the dashboard at http://192.168.x.x:3015. Leave this on.
      CORS_ALLOW_LAN: ${CORS_ALLOW_LAN:-true}
    ports:
      - "${BACKEND_HOST_PORT:-4515}:3000"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: laketown-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://apis.laketown.co.ke/api}
    container_name: laketown-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://apis.laketown.co.ke/api}
    ports:
      - "${FRONTEND_HOST_PORT:-3015}:3000"
    networks:
      - app-network
    depends_on:
      - backend


volumes:
  db_data: {}

networks:
  app-network:
    driver: bridge

