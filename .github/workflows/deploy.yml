name: Deploy to Production

on:
  push:
    branches:
      - development
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: laketown_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d laketown_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TZ: UTC
      APP_TIMEZONE: Africa/Nairobi
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: "5432"
      DATABASE_USER: test
      DATABASE_PASSWORD: test
      DATABASE_NAME: laketown_test
      JWT_SECRET: ci_jwt_secret
      JWT_EXPIRES_IN: 1d
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - name: Backend unit tests
        working-directory: backend
        run: |
          npm ci --omit=optional
          npm run test:cov
      - name: Backend e2e
        working-directory: backend
        run: npm run test:e2e

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            
            # Checkout development branch
            echo "📦 Checking out development branch..."
            git fetch origin
            git checkout development || git checkout -b development origin/development
            
            # Pull latest code
            echo "⬇️  Pulling latest code from development branch..."
            git pull origin development
            
            # Note: Nginx should be configured separately on the host
            echo "ℹ️  Note: Configure nginx separately on the host"
            
            # Create .env.production file from secrets
            cat > .env.production << EOF
            DATABASE_USER=${{ secrets.DATABASE_USER }}
            DATABASE_PASSWORD=${{ secrets.DATABASE_PASSWORD }}
            DATABASE_NAME=${{ secrets.DATABASE_NAME }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_EXPIRES_IN=${{ secrets.JWT_EXPIRES_IN }}
            FRONTEND_URL=${{ secrets.FRONTEND_URL }}
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            EOF
            
            # Login to GitHub Container Registry
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
            
            # Pull latest images
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:${{ github.sha }} || echo "Backend image not found in registry, will build locally"
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:${{ github.sha }} || echo "Frontend image not found in registry, will build locally"
            
            # Tag images as latest if pulled successfully
            docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:${{ github.sha }} laketown-backend:latest 2>/dev/null || true
            docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:${{ github.sha }} laketown-frontend:latest 2>/dev/null || true
            
            # Detect docker-compose command (v1 or v2)
            if command -v docker-compose > /dev/null 2>&1; then
                COMPOSE_CMD="docker-compose"
            elif docker compose version > /dev/null 2>&1; then
                COMPOSE_CMD="docker compose"
            else
                echo "❌ docker-compose is not installed"
                exit 1
            fi
            echo "Using: $COMPOSE_CMD"
            
            # Stop and remove old containers
            echo "🛑 Stopping existing containers..."
            $COMPOSE_CMD -f docker-compose.prod.yml down || true
            
            # Rebuild and start services with production config
            echo "🔨 Rebuilding and starting services..."
            $COMPOSE_CMD -f docker-compose.prod.yml --env-file .env.production up -d --build
            
            # Clean up old images
            docker image prune -f
            
            # Show running containers
            $COMPOSE_CMD -f docker-compose.prod.yml ps

      - name: Health check
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            sleep 15
            echo "Checking backend health..."
            curl -f ${{ secrets.NEXT_PUBLIC_API_URL }}/health || exit 1
            echo "✅ Backend health check passed"
            echo "Checking frontend health..."
            curl -f ${{ secrets.FRONTEND_URL }} || exit 1
            echo "✅ Frontend health check passed"

